name: MeTube-SRT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: |
          docker compose config
          docker compose -f docker-compose.release.yml config

      - name: Validate Windows launchers
        shell: pwsh
        run: |
          $required = @(
            'MULAI_MeTube-SRT.bat',
            'HENTIKAN_MeTube-SRT.bat',
            'UPDATE_MeTube-SRT.bat'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Windows launcher missing: $path"
            }
            $text = Get-Content $path -Raw
            if ($text -notmatch '(?i)docker') {
              throw "Windows launcher does not invoke Docker: $path"
            }
          }

      - name: Validate Windows smoke script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/test-youtube-srt.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: ui
        run: pnpm run lint

      - name: Frontend build
        working-directory: ui
        run: pnpm run build

      - name: Frontend tests
        working-directory: ui
        run: pnpm exec ng test --watch=false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Compile backend
        run: python -m compileall app

      - name: Backend tests
        run: uv run pytest app/tests/
