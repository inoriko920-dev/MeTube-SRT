name: Publish MeTube-SRT v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Windows portable folder
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/MeTube-SRT-Windows/downloads
          rsync -a ./ dist/MeTube-SRT-Windows/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='downloads' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='ui/node_modules' \
            --exclude='**/__pycache__' \
            --exclude='*.pyc'
          printf 'Folder hasil download MeTube-SRT. Jangan hapus folder ini jika ingin menyimpan hasil.\n' > dist/MeTube-SRT-Windows/downloads/README.txt
          printf 'MeTube-SRT v1.0.0 - Windows\n\n1. Install dan jalankan Docker Desktop.\n2. Double-click MULAI_MeTube-SRT.bat.\n3. Browser akan membuka http://localhost:8081.\n4. Centang Download subtitle (SRT) jika ingin video + SRT.\n\nSubtitle manual diprioritaskan; jika tidak ada, caption auto-generated asli boleh digunakan. Auto-translate tidak diminta.\n' > dist/MeTube-SRT-Windows/PETUNJUK_CEPAT.txt

      - name: Create release ZIP and checksum
        run: |
          set -euo pipefail
          cd dist
          zip -r -9 MeTube-SRT-Windows-v1.0.0.zip MeTube-SRT-Windows
          sha256sum MeTube-SRT-Windows-v1.0.0.zip > MeTube-SRT-Windows-v1.0.0.zip.sha256

      - name: Verify ZIP contents
        run: |
          set -euo pipefail
          unzip -l dist/MeTube-SRT-Windows-v1.0.0.zip | grep -q 'MULAI_MeTube-SRT.bat'
          unzip -l dist/MeTube-SRT-Windows-v1.0.0.zip | grep -q 'HENTIKAN_MeTube-SRT.bat'
          unzip -l dist/MeTube-SRT-Windows-v1.0.0.zip | grep -q 'UPDATE_MeTube-SRT.bat'
          unzip -l dist/MeTube-SRT-Windows-v1.0.0.zip | grep -q 'docker-compose.release.yml'
          unzip -l dist/MeTube-SRT-Windows-v1.0.0.zip | grep -q 'scripts/test-youtube-srt.ps1'
          sha256sum -c dist/MeTube-SRT-Windows-v1.0.0.zip.sha256

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag published Docker image as v1.0.0
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/metube-srt:v1.0.0 \
            ghcr.io/${{ github.repository_owner }}/metube-srt:latest

      - name: Create GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 \
              dist/MeTube-SRT-Windows-v1.0.0.zip \
              dist/MeTube-SRT-Windows-v1.0.0.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create v1.0.0 \
              dist/MeTube-SRT-Windows-v1.0.0.zip \
              dist/MeTube-SRT-Windows-v1.0.0.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'MeTube-SRT v1.0.0' \
              --notes 'Rilis pertama MeTube-SRT. Menambahkan checkbox Download subtitle (SRT) untuk video, playlist, dan channel. Subtitle manual diprioritaskan; bila tidak tersedia, caption auto-generated asli dapat digunakan. Auto-translate tidak diminta. Paket Windows menyertakan launcher mulai, hentikan, update, Docker Compose, source fallback, dan skrip tes end-to-end.'
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeTube-SRT-Windows-v1.0.0
          path: |
            dist/MeTube-SRT-Windows-v1.0.0.zip
            dist/MeTube-SRT-Windows-v1.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 90
