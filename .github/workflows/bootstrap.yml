name: Bootstrap MeTube-SRT source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect completed bootstrap
        id: state
        shell: bash
        run: |
          if [[ -f app/main.py ]]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import pinned MeTube upstream
        if: steps.state.outputs.done != 'true'
        env:
          UPSTREAM_COMMIT: a3896604540223ecbb8258b41b1d745d62647d16
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/alexta69/metube.git /tmp/metube
          git -C /tmp/metube checkout "$UPSTREAM_COMMIT"

          # Keep this repository's workflow/patch tooling, but import the full
          # application source and all upstream tests/docs/license.
          rsync -a \
            --exclude '.git' \
            --exclude '.github/workflows' \
            /tmp/metube/ ./

          # dl_formats.py contains the same captions condition in get_format()
          # and get_opts(). The patch targets get_opts(); make the earlier one
          # temporarily unique so the strict patch guard can select one block.
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dl_formats.py')
          s = p.read_text(encoding='utf-8')
          old = '    if download_type == "captions":\n        return "bestaudio/best"\n'
          new = '    if download_type == "captions":  # METUBE_SRT_BOOTSTRAP_SENTINEL\n        return "bestaudio/best"\n'
          if s.count(old) != 1:
              raise SystemExit(f'Could not disambiguate captions get_format block: {s.count(old)} matches')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python scripts/apply_patch.py .

          python - <<'PY'
          from pathlib import Path
          p = Path('app/dl_formats.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    if download_type == "captions":  # METUBE_SRT_BOOTSTRAP_SENTINEL\n',
                        '    if download_type == "captions":\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

          printf '%s\n' "$UPSTREAM_COMMIT" > UPSTREAM_COMMIT

      - name: Commit imported source
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: bootstrap MeTube-SRT from pinned upstream"
          git push origin HEAD:main
