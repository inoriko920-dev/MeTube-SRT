name: MeTube-SRT Runtime Smoke

on:
  workflow_run:
    workflows:
      - Publish MeTube-SRT Docker image
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull ghcr.io/${{ github.repository_owner }}/metube-srt:latest

      - name: Start MeTube-SRT
        run: |
          mkdir -p "$RUNNER_TEMP/metube-downloads"
          docker run -d \
            --name metube-srt-smoke \
            -p 8081:8081 \
            -v "$RUNNER_TEMP/metube-downloads:/downloads" \
            ghcr.io/${{ github.repository_owner }}/metube-srt:latest

      - name: Wait for healthy web app
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs metube-srt-smoke
          exit 1

      - name: Verify API
        run: curl -fsS http://127.0.0.1:8081/api/version

      - name: Show container state on failure
        if: failure()
        run: |
          docker ps -a
          docker logs metube-srt-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f metube-srt-smoke || true
