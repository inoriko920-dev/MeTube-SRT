name: Repair MeTube-SRT source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair source and patch generator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ytdl = Path('app/ytdl.py')
          s = ytdl.read_text(encoding='utf-8')

          old = "                video_password=video_password,\n                download_subtitles=download_subtitles,\n            )\n            error = await self.__add_download(dl, auto_start)"
          new = "                video_password=video_password,\n            )\n            error = await self.__add_download(dl, auto_start)"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one duplicate DownloadInfo keyword block, found {s.count(old)}')
          s = s.replace(old, new, 1)

          old = "                        sponsorblock=sponsorblock,\n                        audio_tags=audio_tags,\n                        video_password=video_password,\n                    )\n                )\n            if any(res['status'] == 'error' for res in results):"
          new = "                        sponsorblock=sponsorblock,\n                        audio_tags=audio_tags,\n                        video_password=video_password,\n                        download_subtitles=download_subtitles,\n                    )\n                )\n            if any(res['status'] == 'error' for res in results):"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one playlist propagation block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          ytdl.write_text(s, encoding='utf-8')

          patch = Path('scripts/apply_patch.py')
          p = patch.read_text(encoding='utf-8')
          marker = 'print("MeTube-SRT patch applied successfully")'
          if marker not in p:
              raise SystemExit('Patch success marker not found')
          maintenance = r'''
# Final normalization for the two call sites that share similar tails above.
# Keep exactly one flag on the video DownloadInfo and explicitly propagate it
# from playlist/channel recursion into every child video.
replace_once(
    "app/ytdl.py",
    '''                video_password=video_password,\n                download_subtitles=download_subtitles,\n            )\n            error = await self.__add_download(dl, auto_start)''',
    '''                video_password=video_password,\n            )\n            error = await self.__add_download(dl, auto_start)''',
)
replace_once(
    "app/ytdl.py",
    '''                        sponsorblock=sponsorblock,\n                        audio_tags=audio_tags,\n                        video_password=video_password,\n                    )\n                )\n            if any(res['status'] == 'error' for res in results):''',
    '''                        sponsorblock=sponsorblock,\n                        audio_tags=audio_tags,\n                        video_password=video_password,\n                        download_subtitles=download_subtitles,\n                    )\n                )\n            if any(res['status'] == 'error' for res in results):''',
)

'''
          if 'Final normalization for the two call sites' not in p:
              p = p.replace(marker, maintenance + marker, 1)
              patch.write_text(p, encoding='utf-8')
          PY

          python -m compileall -q app

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ytdl.py scripts/apply_patch.py
          if git diff --cached --quiet; then
            echo "No repair needed"
            exit 0
          fi
          git commit -m "fix: propagate SRT option through playlist and channel"
          git push origin HEAD:main
