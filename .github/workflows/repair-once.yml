name: Repair MeTube-SRT bootstrap output

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicated subtitle keyword
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/ytdl.py')
          s = p.read_text(encoding='utf-8')
          duplicate = '''                subtitle_mode=subtitle_mode,
                download_subtitles=download_subtitles,
                ytdl_options_presets=ytdl_options_presets,
                ytdl_options_overrides=ytdl_options_overrides,
                clip_start=clip_start,
                clip_end=clip_end,
                live_status=entry.get('live_status'),
                live_release_timestamp=entry.get('release_timestamp'),
                sponsorblock=sponsorblock,
                audio_tags=audio_tags,
                video_password=video_password,
                download_subtitles=download_subtitles,
'''
          fixed = '''                subtitle_mode=subtitle_mode,
                download_subtitles=download_subtitles,
                ytdl_options_presets=ytdl_options_presets,
                ytdl_options_overrides=ytdl_options_overrides,
                clip_start=clip_start,
                clip_end=clip_end,
                live_status=entry.get('live_status'),
                live_release_timestamp=entry.get('release_timestamp'),
                sponsorblock=sponsorblock,
                audio_tags=audio_tags,
                video_password=video_password,
'''
          count = s.count(duplicate)
          if count == 1:
              p.write_text(s.replace(duplicate, fixed, 1), encoding='utf-8')
          elif count == 0:
              print('Duplicate already absent')
          else:
              raise SystemExit(f'Unexpected duplicate block count: {count}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ytdl.py
          if git diff --cached --quiet; then
            echo "No repair needed"
          else
            git commit -m "fix: remove duplicate download_subtitles keyword"
            git push origin HEAD:main
          fi
