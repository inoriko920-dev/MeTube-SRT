name: Repair MeTube-SRT source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python scripts/repair_srt_source.py

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ytdl.py scripts/apply_patch.py
          if git diff --cached --quiet; then
            echo "No repair needed"
          else
            git commit -m "fix: propagate SRT option through playlist and channel"
            git push origin HEAD:main
          fi
