name: MeTube-SRT Live YouTube Smoke

on:
  workflow_run:
    workflows:
      - Publish MeTube-SRT Docker image
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  live-youtube:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull ghcr.io/${{ github.repository_owner }}/metube-srt:latest

      - name: Start MeTube-SRT
        run: |
          mkdir -p "$RUNNER_TEMP/metube-live-downloads"
          docker run -d \
            --name metube-srt-live \
            -p 8082:8081 \
            -v "$RUNNER_TEMP/metube-live-downloads:/downloads" \
            ghcr.io/${{ github.repository_owner }}/metube-srt:latest

      - name: Wait for app
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8082/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs metube-srt-live
          exit 1

      - name: Queue 3-second video with SRT
        run: |
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {
            "url": "https://www.youtube.com/watch?v=aircAruvnKk",
            "download_type": "video",
            "codec": "auto",
            "format": "any",
            "quality": "worst",
            "playlist_item_limit": 0,
            "auto_start": true,
            "split_by_chapters": false,
            "subtitle_language": "en",
            "subtitle_mode": "prefer_manual",
            "download_subtitles": true,
            "ytdl_options_presets": [],
            "ytdl_options_overrides": "",
            "clip_start": "0",
            "clip_end": "3"
          }
          JSON
          curl -fsS \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/request.json" \
            http://127.0.0.1:8082/add | tee "$RUNNER_TEMP/add-response.json"

      - name: Wait for download completion
        run: |
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8082/history > "$RUNNER_TEMP/history.json"
            STATE=$(python - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'history.json')
          data = json.load(open(p, encoding='utf-8'))
          if data.get('done'):
              print('done')
          elif data.get('queue') or data.get('pending'):
              print('running')
          else:
              print('empty')
          PY
          )
            if [ "$STATE" = done ]; then
              cat "$RUNNER_TEMP/history.json"
              exit 0
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/history.json" || true
          docker logs metube-srt-live
          exit 1

      - name: Classify YouTube result
        id: classify
        run: |
          python - <<'PY'
          import json, os, sys

          path = os.path.join(os.environ['RUNNER_TEMP'], 'history.json')
          data = json.load(open(path, encoding='utf-8'))
          done = data.get('done') or []
          if not done:
              print('No completed item was returned by MeTube-SRT', file=sys.stderr)
              sys.exit(1)

          item = done[0]
          status = str(item.get('status') or '').lower()
          msg = str(item.get('msg') or '')

          if status == 'error':
              bot_markers = (
                  "Sign in to confirm you’re not a bot",
                  "Sign in to confirm you're not a bot",
                  'confirm you’re not a bot',
                  "confirm you're not a bot",
              )
              if any(marker in msg for marker in bot_markers):
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                      fh.write('bot_blocked=true\n')
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                      fh.write('## Live YouTube smoke: environment blocked\n\n')
                      fh.write('GitHub-hosted runner was challenged by YouTube anti-bot protection. ')
                      fh.write('The app accepted the request and reached yt-dlp, but YouTube refused formats. ')
                      fh.write('This is not classified as an application failure.\n')
                  print('YouTube anti-bot challenge detected on GitHub-hosted runner; treating as environment-blocked.')
                  sys.exit(0)

              print('MeTube-SRT returned a non-environment download error:', file=sys.stderr)
              print(msg, file=sys.stderr)
              sys.exit(1)

          if status not in ('finished', 'done', 'complete', 'completed'):
              print(f'Unexpected completed-item status: {status!r}', file=sys.stderr)
              sys.exit(1)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('bot_blocked=false\n')
          PY

      - name: Verify video and SRT files
        if: steps.classify.outputs.bot_blocked != 'true'
        run: |
          echo 'Downloaded files:'
          find "$RUNNER_TEMP/metube-live-downloads" -maxdepth 4 -type f -print
          SRT_COUNT=$(find "$RUNNER_TEMP/metube-live-downloads" -type f -name '*.srt' | wc -l)
          MEDIA_COUNT=$(find "$RUNNER_TEMP/metube-live-downloads" -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.mkv' -o -name '*.mov' \) | wc -l)
          test "$SRT_COUNT" -ge 1
          test "$MEDIA_COUNT" -ge 1

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo 'History:'
          cat "$RUNNER_TEMP/history.json" 2>/dev/null || true
          echo 'Files:'
          find "$RUNNER_TEMP/metube-live-downloads" -maxdepth 4 -type f -print 2>/dev/null || true
          echo 'Container logs:'
          docker logs metube-srt-live || true

      - name: Cleanup
        if: always()
        run: docker rm -f metube-srt-live || true
