name: Desktop CI

on:
  push:
    branches:
      - main
      - "step08/**"
      - "step09/**"
    paths:
      - "desktop/**"
      - "docs/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "docs/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-foundation:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: "desktop/uv.lock"

      - name: Install Python
        run: uv python install 3.13.16

      - name: Generate or verify lock
        shell: pwsh
        run: |
          if (Test-Path "uv.lock") {
            uv lock --check
          } else {
            uv lock
            Write-Host "::warning::uv.lock was generated in CI; commit it to finish STEP 08 dependency lock."
          }

      - name: Sync
        run: uv sync --all-groups

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Import architecture
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest

      - name: Foundation script
        run: uv run python scripts/check_foundation.py

      - name: Package self-check
        run: uv run python -m metube_srt_desktop --self-check

      - name: Capture STEP 09 shell screenshot
        run: uv run python scripts/capture_step09_shell.py

      - name: Secret scan
        shell: pwsh
        run: |
          $json = uv run detect-secrets scan --all-files --exclude-files "(\.venv|uv\.lock|build|dist|\.pytest_cache|\.ruff_cache|\.import_linter_cache)"
          $report = $json | ConvertFrom-Json
          $findings = @($report.results.PSObject.Properties)
          if ($findings.Count -gt 0) {
            $json
            Write-Error "detect-secrets found $($findings.Count) file(s) with candidate secrets."
            exit 1
          }
          Write-Host "Secret scan: 0 findings"

      - name: Upload STEP 09 shell screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step09-app-shell-screenshot
          path: desktop/build/step09-evidence/step09-app-shell.png
          if-no-files-found: warn

      - name: Upload generated lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-uv-lock
          path: desktop/uv.lock
          if-no-files-found: warn
