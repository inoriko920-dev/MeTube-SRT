name: Publish MeTube-SRT v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.0.1.yml'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: v1.0.1
      TARGET_SHA: f0ce5ed2919a018374094c381ecc8a6ed4eba15e
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Prepare pinned Windows package
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/MeTube-SRT-Windows/downloads
          rsync -a ./ dist/MeTube-SRT-Windows/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='downloads' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='ui/node_modules' \
            --exclude='**/__pycache__' \
            --exclude='*.pyc'
          printf '%s\n' "$VERSION" > dist/MeTube-SRT-Windows/VERSI_IMAGE.txt
          printf 'Folder hasil download MeTube-SRT. Jangan hapus folder ini jika ingin menyimpan hasil.\n' > dist/MeTube-SRT-Windows/downloads/README.txt
          printf 'MeTube-SRT %s - Windows\n\nPaket ini dikunci ke Docker image %s.\n1. Install dan jalankan Docker Desktop.\n2. Double-click MULAI_MeTube-SRT.bat.\n3. Browser akan membuka http://localhost:8081.\n4. Centang Download subtitle (SRT) jika ingin video + SRT.\n5. UPDATE_MeTube-SRT.bat hanya berpindah ke GitHub Release stabil terbaru.\n' "$VERSION" "$VERSION" > dist/MeTube-SRT-Windows/PETUNJUK_CEPAT.txt

      - name: Create ZIP and checksum
        run: |
          set -euo pipefail
          cd dist
          zip -r -9 "MeTube-SRT-Windows-$VERSION.zip" MeTube-SRT-Windows
          sha256sum "MeTube-SRT-Windows-$VERSION.zip" > "MeTube-SRT-Windows-$VERSION.zip.sha256"

      - name: Verify pinned package
        run: |
          set -euo pipefail
          ZIP="dist/MeTube-SRT-Windows-$VERSION.zip"
          unzip -l "$ZIP" | grep -q 'MULAI_MeTube-SRT.bat'
          unzip -l "$ZIP" | grep -q 'HENTIKAN_MeTube-SRT.bat'
          unzip -l "$ZIP" | grep -q 'UPDATE_MeTube-SRT.bat'
          unzip -l "$ZIP" | grep -q 'VERSI_IMAGE.txt'
          unzip -l "$ZIP" | grep -q 'docker-compose.release.yml'
          test "$(unzip -p "$ZIP" MeTube-SRT-Windows/VERSI_IMAGE.txt | tr -d '\r\n')" = "$VERSION"
          (cd dist && sha256sum -c "MeTube-SRT-Windows-$VERSION.zip.sha256")

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag current stable image as v1.0.1
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/metube-srt:$VERSION \
            ghcr.io/${{ github.repository_owner }}/metube-srt:latest

      - name: Create GitHub Release v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            "dist/MeTube-SRT-Windows-$VERSION.zip" \
            "dist/MeTube-SRT-Windows-$VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "MeTube-SRT $VERSION" \
            --notes 'Patch distribusi Windows. Paket rilis sekarang mengunci Docker image ke tag versi yang sama melalui VERSI_IMAGE.txt. MULAI menjalankan versi yang tersimpan; UPDATE mencari GitHub Release stabil terbaru dan tidak langsung mengikuti tag development latest. Fitur video + SRT tetap sama: subtitle manual diprioritaskan, auto-generated asli boleh digunakan jika manual tidak ada, dan auto-translate tidak diminta.'

      - name: Upload release artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: MeTube-SRT-Windows-v1.0.1
          path: |
            dist/MeTube-SRT-Windows-v1.0.1.zip
            dist/MeTube-SRT-Windows-v1.0.1.zip.sha256
          retention-days: 90
