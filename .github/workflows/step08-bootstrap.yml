name: STEP 08 Format And Lock

on:
  push:
    branches:
      - step08/bootstrap-overlay
    paths:
      - '.github/workflows/step08-bootstrap.yml'

permissions:
  contents: write

jobs:
  format-lock:
    runs-on: windows-latest
    steps:
      - name: Checkout desktop task branch
        uses: actions/checkout@v4
        with:
          ref: step08/desktop-skeleton
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'

      - name: Install Python
        working-directory: desktop
        run: uv python install 3.13.16

      - name: Generate lock and sync
        working-directory: desktop
        run: |
          uv lock
          uv sync --all-groups

      - name: Apply Ruff formatter
        working-directory: desktop
        run: uv run ruff format .

      - name: Commit formatter and lock output
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/uv.lock desktop/src desktop/tests desktop/scripts
          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore(desktop): format source and lock dependencies'
            git push origin HEAD:refs/heads/step08/desktop-skeleton
          } else {
            Write-Host 'No formatting or lock changes required.'
          }
